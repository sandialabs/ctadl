name: CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  NIX_CONFIG: experimental-features = nix-command flakes

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Materialize flake inputs
        run: nix flake archive --no-write-lock-file .
      - name: Run test suite
        run: nix run .#test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    # Defined at job level (not per-step) so the step `if:` conditions below can
    # read them. A step's `if` is evaluated before that step's own `env:` block is
    # applied, so step-level env is invisible to the step's own condition.
    env:
      READTHEDOCS_PROJECT: ${{ secrets.READTHEDOCS_PROJECT }}
      READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Materialize flake inputs
        run: nix flake archive --no-write-lock-file .

      # Read the Docs first, so a duplicate/failed PyPI publish (e.g. a re-run of
      # an already-released version) doesn't block the docs update.
      - name: Sync Read the Docs versions
        if: env.READTHEDOCS_PROJECT != '' && env.READTHEDOCS_TOKEN != ''
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            "https://app.readthedocs.org/api/v3/projects/${READTHEDOCS_PROJECT}/sync-versions/"

      - name: Trigger Read the Docs latest build
        if: env.READTHEDOCS_PROJECT != '' && env.READTHEDOCS_TOKEN != ''
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            "https://app.readthedocs.org/api/v3/projects/${READTHEDOCS_PROJECT}/versions/latest/builds/"

      - name: Trigger Read the Docs release build
        if: github.event_name == 'release' && env.READTHEDOCS_PROJECT != '' && env.READTHEDOCS_TOKEN != ''
        run: |
          # sync-versions above is async; the new tag's version may not exist on
          # RTD yet. Poll for it before triggering its build.
          api="https://app.readthedocs.org/api/v3/projects/${READTHEDOCS_PROJECT}"
          for attempt in $(seq 1 12); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
              "${api}/versions/${GITHUB_REF_NAME}/")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Version ${GITHUB_REF_NAME} not on RTD yet (HTTP ${status}); retrying in 10s..."
            sleep 10
          done
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Token ${READTHEDOCS_TOKEN}" \
            "${api}/versions/${GITHUB_REF_NAME}/builds/"

      - name: Publish packages to PyPI
        if: github.event_name == 'release'
        env:
          TWINE_REPOSITORY: pypi
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: nix run .#publish-pypi
